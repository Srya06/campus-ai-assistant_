version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-ai-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://campus_user:campus_password@postgres:5432/campus_ai_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - SECRET_KEY=${SECRET_KEY:-campus_production_secret_key_change_me}
      - CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: campus-ai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=campus_user
      - POSTGRES_PASSWORD=campus_password
      - POSTGRES_DB=campus_ai_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

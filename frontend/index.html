<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Communication AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Campus Communication Assistant</h1>
            <p class="subtitle">Generate professional academic communication instantly with AI</p>
        </header>

        <form id="communicationForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="type">📄 Communication Type</label>
                <select id="type" required>
                    <option value="" disabled selected>Select communication type</option>
                    <option value="Email">📧 Email</option>
                    <option value="Leave Letter">📝 Leave Letter</option>
                    <option value="Permission Letter">✅ Permission Letter</option>
                    <option value="Notice">📢 Notice</option>
                    <option value="Complaint Letter">⚠️ Complaint Letter</option>
                    <option value="Event Announcement">🎉 Event Announcement</option>
                    <option value="WhatsApp Message">💬 WhatsApp Message</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">💭 Describe your situation</label>
                <textarea 
                    id="message" 
                    placeholder="Example: I need permission to miss class tomorrow because I have a medical appointment"
                    required
                    minlength="5"
                    maxlength="1000"
                ></textarea>
                <div class="character-count">
                    <span id="charCount">0</span>/1000 characters
                </div>
            </div>

            <div class="row">
                <div class="form-group half">
                    <label for="tone">🎨 Tone</label>
                    <select id="tone" required>
                        <option value="Formal">Formal</option>
                        <option value="Professional" selected>Professional</option>
                        <option value="Friendly">Friendly</option>
                        <option value="Polite">Polite</option>
                    </select>
                </div>

                <div class="form-group half">
                    <label for="length">📏 Length</label>
                    <select id="length" required>
                        <option value="Short">Short (Quick)</option>
                        <option value="Medium" selected>Medium (Balanced)</option>
                        <option value="Detailed">Detailed (Comprehensive)</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">Generate Message</span>
                <span class="loading-spinner" style="display: none;">⌛</span>
            </button>
        </form>

        <div class="output-section" id="outputSection" style="display: none;">
            <div class="output-header">
                <h2>✨ Generated Communication</h2>
                <div class="output-actions">
                    <button class="icon-btn" onclick="copyToClipboard()" title="Copy to clipboard">📋</button>
                    <button class="icon-btn" onclick="downloadOutput()" title="Download as text file">💾</button>
                </div>
            </div>
            <div class="output-container">
                <pre id="output"></pre>
            </div>
        </div>

        <div class="error-message" id="errorMessage" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
